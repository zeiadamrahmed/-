<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />

    <title>آلة حاسبة</title>

    <!-- Favicon -->
    <link rel="icon" href="./img/calculator-solid.png" type="image/x-icon" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
    />

    <!-- MDB -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-dark d-flex align-items-center justify-content-center p-3">
    <div
      class="card bg-black p-3 shadow-lg border-0 rounded-4 d-flex flex-column"
      style="width: 400px; height: 550px"
    >
      <div class="d-flex justify-content-between align-items-center mb-2 px-1">
        <button
          class="btn btn-sm btn-dark text-white border-0 ms-auto"
          type="button"
          id="historyBtn"
          onclick="toggleHistory()"
        >
          <i class="fa-solid fa-clock-rotate-left"></i> السجل
        </button>
      </div>

      <div
        class="mb-3 d-none position-absolute w-100 start-0 px-3"
        id="historyContainer"
        style="top: 55px; z-index: 10"
      >
        <div
          class="card card-body bg-black text-white p-2 small border border-secondary shadow-lg"
          style="max-height: 120px; overflow-y: auto"
          id="history"
        ></div>
      </div>
      <input
        type="text"
        id="input"
        class="form-control bg-black text-white border-0 fs-2 mb-3 rounded-2 p-4"
      />

      <div class="row g-2 flex-grow-1">
        <div class="col-3 d-flex">
          <button
            onclick="clearDisplay()"
            class="btn btn-light text-dark rounded-circle p-0 d-flex align-items-center justify-content-center fs-3"
            style="width: 60px; height: 60px"
          >
            AC
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="deleteLast()"
            cl
            class="btn btn-light text-dark rounded-circle p-0 d-flex align-items-center justify-content-center fs-3"
            style="width: 60px; height: 60px"
          >
            <i class="fa-solid fa-delete-left"></i>
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('%')"
            cl
            class="btn btn-light text-dark rounded-circle p-0 d-flex align-items-center justify-content-center fs-3"
            style="width: 60px; height: 60px"
          >
            %
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('/')"
            cl
            class="btn btn-warning text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-3"
            style="width: 60px; height: 60px"
          >
            <i class="fa-solid fa-divide"></i>
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('7')"
            cl
            class="btn btn-dark text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-4"
            style="width: 60px; height: 60px"
          >
            7
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('8')"
            cl
            class="btn btn-dark text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-4"
            style="width: 60px; height: 60px"
          >
            8
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('9')"
            cl
            class="btn btn-dark text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-4"
            style="width: 60px; height: 60px"
          >
            9
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('*')"
            cl
            class="btn btn-warning text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-3"
            style="width: 60px; height: 60px"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('4')"
            cl
            class="btn btn-dark text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-4"
            style="width: 60px; height: 60px"
          >
            4
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('5')"
            cl
            class="btn btn-dark text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-4"
            style="width: 60px; height: 60px"
          >
            5
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('6')"
            cl
            class="btn btn-dark text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-4"
            style="width: 60px; height: 60px"
          >
            6
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('-')"
            cl
            class="btn btn-warning text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-3"
            style="width: 60px; height: 60px"
          >
            -
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('1')"
            cl
            class="btn btn-dark text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-4"
            style="width: 60px; height: 60px"
          >
            1
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('2')"
            cl
            class="btn btn-dark text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-4"
            style="width: 60px; height: 60px"
          >
            2
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('3')"
            cl
            class="btn btn-dark text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-4"
            style="width: 60px; height: 60px"
          >
            3
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('+')"
            cl
            class="btn btn-warning text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-3"
            style="width: 60px; height: 60px"
          >
            +
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('00')"
            cl
            class="btn btn-dark text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-4"
            style="width: 60px; height: 60px"
          >
            00
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('0')"
            cl
            class="btn btn-dark text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-4"
            style="width: 60px; height: 60px"
          >
            0
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="appendValue('.')"
            cl
            class="btn btn-dark text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-4"
            style="width: 60px; height: 60px"
          >
            .
          </button>
        </div>

        <div class="col-3 d-flex">
          <button
            onclick="calculate()"
            class="btn btn-warning text-white rounded-circle p-0 d-flex align-items-center justify-content-center fs-3"
            style="width: 60px; height: 60px"
          >
            =
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
